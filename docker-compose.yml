# Databases for the integration suite.
#
#   docker compose up -d --wait
#   go test -tags=integration ./test/...
#
# Ports are deliberately non-standard so this never collides with a local
# PostgreSQL or MySQL.
name: rx-crud

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rxcrud
      POSTGRES_PASSWORD: rxcrud
      POSTGRES_DB: rxcrud
    command: >
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxcrud -d rxcrud"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rxcrud
      MYSQL_DATABASE: rxcrud
      MYSQL_USER: rxcrud
      MYSQL_PASSWORD: rxcrud
    command: >
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --innodb-flush-log-at-trx-commit=0
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u rxcrud -prxcrud --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql
